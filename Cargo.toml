[package]
name = "cmx"
version.workspace = true
description = "Rust Spectral Color Management Library"
authors.workspace = true
repository.workspace = true
keywords = ["color_management", "icc_profiles", "iccmax"]
edition.workspace = true
license.workspace = true

[workspace]
members = [
    "xtask",
    ".",         # main crate
    "cmx-icc",   # WebAssembly bindings
]

[workspace.package]
version = "0.2.0"
authors = ["Gerard Harbers", "Harbers Bik LLC"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/harbik/cmx"
edition = "2021"

[workspace.dependencies]
cmx = { version = "0.2.0" }

[patch.crates-io]
cmx = { path = "." }

[features]
v5 = []

[dependencies]
anyhow = "1.0.99"
approx = "0.5.1"
chrono = { version = "0.4.19", features = ["serde", "wasmbind"] }
clap = { version = "4.3", features = ["derive"] }
colorimetry = "0.0.9"
delegate = "0.13.4"
# half = { version = "2.6", features = ["serde"] }
hex = "0.4.3"
indexmap = { version = "2.10.0", features = ["serde"] }
isocountry = "0.3.2"
isolang = { version = "2.0", features = ["serde"] }
md5 = "0.8.0"
nalgebra = "0.33.2"
num = "0.4.3"
num-derive = "0.4"
num-traits = "0.2.14"
paste = "1.0.15"
serde = { version = "1.0.125", features = ["derive"] }
serde_arrays = "0.2"
serde_json = "1.0.64"
strum = {version = "0.25", features = ["derive"]}  # for enum iteration and derive macros
thiserror = "2.0.12"
toml = "0.9.5"
zerocopy = { version = "0.8.26", features = ["derive", "alloc"] }

[[bin]]
name = "cmx"
path = "src/bin/cmx.rs"

[dev-dependencies]
# glob = "0.3.0"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.21"

